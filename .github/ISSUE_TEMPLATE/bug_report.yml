name: Bug or reproduction failure
description: Report a failure in a released public interface, demo, or test.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the public component and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide exact commands, commit SHA, Python version, and sanitized output.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safe report
      options:
        - label: This report contains no credentials, private prompts, private rules, customer data, or production traces.
          required: true
